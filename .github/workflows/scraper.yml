name: 🔍 Buscar Vagas Agtech (Diário)

on:
  schedule:
    - cron: '11 8 * * *'
  
  workflow_dispatch:

jobs:
  scrape_vagas:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/upload-artifact@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🔍 Rodar scraper de vagas
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python scraper_vagas.py
      
      - name: 📁 Fazer upload de resultados
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: vagas-encontradas
          path: vagas_encontradas.json
          retention-days: 30
      
      - name: ✅ Status
        if: success()
        run: echo "Scraper executado com sucesso!"
      
      - name: ❌ Erro
        if: failure()
        run: echo "Erro ao executar scraper - verifique logs"
